<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Page</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* First and second images full width */
        img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Title below first image */
        h1 {
            font-size: 2em;
            margin: 20px 0;
            padding: 10px 20px;
            color: white;
            background-color: rgba(0,0,0,0.4); /* makes text readable on image */
            border-radius: 8px;
            text-align: center;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.7);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- First image -->
    <img src="src/img1.jpg" alt="First Image">

    <!-- Title below first image -->
    <h1>Will you be my maid of honor?</h1>

    <!-- Second image at bottom -->
    <img src="src/img2.gif" alt="Second Image">
</body>
</html>
