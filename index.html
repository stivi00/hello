<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Page</title>
    <style>
        /* Set html and body to take full height */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Set the background image */
        body {
            background-image: url('src/img1.jpg'); /* path to your image */
            background-size: cover; /* make image cover the screen */
            background-position: center; /* center the image */
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white; /* text color over image */
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7); /* optional for readability */
            text-align: center;
        }

        h1 {
            font-size: 2em;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.3); /* optional overlay for readability */
            border-radius: 8px;
        }

        /* Make text responsive for small screens */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <h1>Hi, welcome yuuuu</h1>
</body>
</html>
